[package]
name = "gz-sim-cli"
default-run = "gz-sim-rs"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
landing-audit = ["gz-physics-multifidelity/landing-audit", "dep:rustix", "rustix/time"]
gpu-batch = ["gz-sim-scene/gpu-batch", "gz-sim-server/gpu-batch"]
default = ["distributed-physics"]
distributed-physics = ["gz-sim-scene/distributed-physics", "gz-sim-server/distributed-physics", "dep:tempfile", "dep:rustix"]
rgb-camera = ["dep:gz-camera-output", "dep:zenoh"]

[[bin]]
name = "gz-sim-rs"
path = "src/main.rs"

[[bin]]
name = "gz-sim-hinge"
path = "src/bin/hinge.rs"
required-features = ["distributed-physics"]

[dependencies]
tempfile = { version = "=3.25.0", optional = true }
gz-camera-output = { path = "../gz-camera-output", default-features = false, optional = true }
zenoh = { workspace = true, optional = true }
gz-fuel-tools.workspace = true
clap.workspace = true
bevy_ecs.workspace = true
gz-physics = { path = "../gz-physics" }
gz-assets = { path = "../gz-assets" }
gz-sim-scene = { path = "../gz-sim-scene", default-features = false }
gz-sim-core = { path = "../gz-sim-core" }
gz-sim-server = { path = "../gz-sim-server", default-features = false }
signal-hook = "=0.3.18"
gz-sim-proto.workspace = true
sdformat.workspace = true
serde = { version = "=1.0.229", features = ["derive"] }
# Replay must preserve the exact recorded f64 values when parsing decimal JSON.
serde_json = { version = "=1.0.149", features = ["float_roundtrip"] }
# Reuse the already locked maintained digest for immutable local recording assets.
sha2 = "=0.10.9"
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }

# M2 uses maintained glTF and HTTP implementations, with only local serving enabled.
gltf = { version = "=1.4.1", default-features = false }
hyper = { version = "=1.12.0", features = ["http1", "server"] }
hyper-util = { version = "=0.1.15", features = ["tokio"] }
http-body-util = "=0.1.5"
bytes = "=1.12.1"
tokio = { version = "=1.54.1", features = ["rt", "net", "time"] }
url = "=2.5.8"

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["fs"], optional = true }

[dev-dependencies]
parry3d-f64 = { version = "=0.31.1", features = ["enhanced-determinism"] }
gz-physics-xpbd = { path = "../gz-physics-xpbd" }
plotters = { version = "=0.3.7", default-features = false, features = ["svg_backend", "line_series"] }
gz-physics-multifidelity = { path = "../gz-physics-multifidelity" }
glam.workspace = true
rustix = { version = "=1.1.5", features = ["process", "event", "time"] }
# Test observers discover the dynamically allocated loopback transport endpoint.
zenoh = { workspace = true, features = ["unstable"] }
serde_json = "=1.0.149"
socket2 = { version = "=0.6.5", features = ["all"] }
gz-sim-proto.workspace = true
tempfile = "=3.25.0"

[lints]
workspace = true

