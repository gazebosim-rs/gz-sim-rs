[package]
name = "gz-sim-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["native-backends"]
native-backends = ["gz-sim-scene/native-backends", "gz-sim-server/native-backends", "dep:gz-physics-dart"]

[[bin]]
name = "gz-sim-rs"
path = "src/main.rs"

[dependencies]
gz-fuel-tools.workspace = true
clap.workspace = true
gz-assets = { path = "../gz-assets" }
gz-sim-scene = { path = "../gz-sim-scene", default-features = false }
gz-sim-core = { path = "../gz-sim-core" }
# Direct dependency so build.rs receives DEP_DART_LIBDIR.
gz-physics-dart = { path = "../gz-physics-dart", optional = true }
gz-sim-server = { path = "../gz-sim-server", default-features = false }
signal-hook = "=0.3.18"
gz-sim-proto.workspace = true
sdformat.workspace = true
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.149"
tungstenite = { version = "=0.30.0", default-features = false, features = ["handshake"] }

# M2 uses maintained glTF and HTTP implementations, with only local serving enabled.
gltf = { version = "=1.4.1", default-features = false }
hyper = { version = "=1.12.0", features = ["http1", "server"] }
hyper-util = { version = "=0.1.15", features = ["tokio"] }
http-body-util = "=0.1.5"
bytes = "=1.12.1"
tokio = { version = "=1.54.1", features = ["rt", "net", "time"] }
url = "=2.5.8"

[dev-dependencies]
zenoh.workspace = true
serde_json = "=1.0.149"
socket2 = { version = "=0.6.5", features = ["all"] }
gz-sim-proto.workspace = true
tempfile = "=3.25.0"

[lints]
workspace = true
