[package]
name = "gz-physics-mujoco"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "MuJoCo 3.11.0 dynamic backend for the Gazebo Bevy runtime"

[dependencies]
gz-physics = { path = "../gz-physics" }
libloading = "=0.8.9"

[dev-dependencies]
bevy_ecs.workspace = true
gz-sim-core = { path = "../gz-sim-core" }
serde_json = "=1.0.149"

# The workspace forbids unsafe code, which a crate cannot relax. This crate needs one
# audited FFI module, so it copies the workspace lints with unsafe code denied and
# allowed only on that module.
[lints.rust]
unsafe_code = "deny"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
