[package]
name = "gz-renderer"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = []
gpu = ["dep:bevy", "dep:wgpu", "dep:pollster"]

[dependencies]
gz-render-frame = { path = "../gz-render-frame" }
glam.workspace = true
thiserror.workspace = true
bevy = { version = "=0.20.0", optional = true, default-features = false, features = ["std", "bevy_asset", "bevy_log", "bevy_render", "bevy_core_pipeline", "bevy_pbr"] }
wgpu = { version = "=30.0.1", optional = true, default-features = false, features = ["vulkan", "wgsl"] }
pollster = { version = "=0.4.0", optional = true }

[lints]
workspace = true

[dev-dependencies]
bevy = { version = "=0.20.0", default-features = false, features = ["multi_threaded"] }
