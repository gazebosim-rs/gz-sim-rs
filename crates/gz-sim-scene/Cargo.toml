[package]
name = "gz-sim-scene"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["native-backends"]
native-backends = ["dep:gz-physics-dart", "dep:gz-physics-mujoco"]

[dependencies]
roxmltree = "=0.20.0"
quick-xml = "=0.38.3"
petgraph.workspace = true
bevy_ecs.workspace = true
glam.workspace = true
parry3d-f64 = "=0.31.1"
thiserror.workspace = true
sdformat.workspace = true
gz-sim-core = { path = "../gz-sim-core" }
gz-physics = { path = "../gz-physics" }
gz-physics-dart = { path = "../gz-physics-dart", optional = true }
gz-physics-mujoco = { path = "../gz-physics-mujoco", optional = true }
gz-physics-rapier = { path = "../gz-physics-rapier" }
gz-physics-tpe = { path = "../gz-physics-tpe" }
gz-sensors = { path = "../gz-sensors" }
gz-assets = { path = "../gz-assets" }

[dev-dependencies]
gz-fuel-tools.workspace = true
tempfile = "=3.25.0"
serde_json = "=1.0.149"

[lints]
workspace = true
