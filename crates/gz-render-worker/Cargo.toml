[package]
name = "gz-render-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
gz-renderer = { path = "../gz-renderer", features = ["gpu"] }
gz-render-frame = { path = "../gz-render-frame" }
gz-render-protocol = { path = "../gz-render-protocol" }
glam.workspace = true
rustix = { version = "=1.1.5", features = ["process"] }

[dev-dependencies]
gz-render-client = { path = "../gz-render-client" }
gz-render-scene = { path = "../gz-render-scene" }
gz-sim-core = { path = "../gz-sim-core" }
gz-sim-scene = { path = "../gz-sim-scene" }
gz-camera-output = { path = "../gz-camera-output" }
gz-msgs.workspace = true
gz-transport.workspace = true
socket2 = { version = "=0.6.5", features = ["all"] }
tempfile = "=3.25.0"
sdformat.workspace = true
rustix = { version = "=1.1.5", features = ["event", "process"] }

[lints]
workspace = true
