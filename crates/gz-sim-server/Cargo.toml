[package]
name = "gz-sim-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["native-backends"]
native-backends = ["gz-sim-scene/native-backends", "dep:gz-physics-dart"]

[dependencies]
crossbeam-channel = { version = "=0.5.17", default-features = false, features = ["std"] }
uuid.workspace = true
zenoh.workspace = true
gz-sim-proto.workspace = true
gz-sim-core = { path = "../gz-sim-core" }
gz-sim-scene = { path = "../gz-sim-scene", default-features = false }
# Direct dependency so build.rs receives DEP_DART_LIBDIR.
gz-physics-dart = { path = "../gz-physics-dart", optional = true }
bevy_ecs.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["hostname", "user"] }

[target.'cfg(unix)'.dev-dependencies]
# Safe, test-only child pipe and process-group containment APIs. Keep the
# existing runtime nix version and hostname/user feature selection unchanged.
nix = { version = "=0.31.3", default-features = false, features = ["fs", "process", "signal"] }

[dev-dependencies]
gz-physics = { path = "../gz-physics" }
# Inspect the live test listener instead of releasing a speculative port.
zenoh = { workspace = true, features = ["unstable"] }
socket2 = { version = "=0.6.5", features = ["all"] }
tempfile = "=3.25.0"
serde_json = "=1.0.149"
sdformat.workspace = true
gz-sensors = { path = "../gz-sensors" }

[lints]
workspace = true
