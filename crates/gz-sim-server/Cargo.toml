[package]
name = "gz-sim-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
crossbeam-channel = { version = "=0.5.17", default-features = false, features = ["std"] }
uuid.workspace = true
zenoh.workspace = true
gz-sim-proto.workspace = true
gz-sim-core = { path = "../gz-sim-core" }
gz-sim-scene = { path = "../gz-sim-scene" }
# Direct dependency so build.rs receives DEP_DART_LIBDIR.
gz-physics-dart = { path = "../gz-physics-dart" }
bevy_ecs.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "=0.31.3", default-features = false, features = ["hostname", "user"] }

[dev-dependencies]
socket2 = { version = "=0.6.5", features = ["all"] }
tempfile = "=3.25.0"
serde_json = "=1.0.149"
sdformat.workspace = true
gz-sensors = { path = "../gz-sensors" }

[lints]
workspace = true
