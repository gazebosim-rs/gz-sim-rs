[package]
name = "gz-physics-distributed"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Local multi-worker rigid-body ownership and tick barriers over Zenoh"

[features]
# Developer-only worker instrumentation. Ordinary release binaries contain no trace hooks.
lane-trace = []
# Developer-only, stage-resolved timings for the local multi-sphere protocol.
sphere-pair-trace = []
# Read-only horizontal contact envelope experiment; never selects a routing policy.
smooth-plane-diagnostics = []
barrier-trace = ["rustix/time"]

[dependencies]
lz4_flex = { version = "=0.11.6", default-features = false, features = ["std", "safe-encode", "safe-decode"] }
bincode = "=1.3.3"
sha2 = "=0.10.9"
same-file = "=1.0.6"
bevy_ecs.workspace = true
glam.workspace = true
bevy_tasks = { version = "=0.20.0", default-features = false, features = ["multi_threaded"] }
gz-physics = { path = "../gz-physics" }
gz-physics-xpbd = { path = "../gz-physics-xpbd", features = ["one-way-checkpoint","prescribed-translation"] }
gz-physics-multifidelity = { path = "../gz-physics-multifidelity", features = ["partition-checkpoint"] }
gz-sim-core = { path = "../gz-sim-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_bytes = "=0.11.19"
serde_json = { version = "=1.0.149", features = ["float_roundtrip"] }
uuid.workspace = true
thiserror.workspace = true
tempfile = "=3.25.0"
zenoh = { workspace = true, features = ["unstable"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "=1.1.5", features = ["event", "fs", "process"] }

[dev-dependencies]
fastrand = "=2.5.0"
gz-assets = { path = "../gz-assets" }
gz-sim-proto.workspace = true
gz-sim-server = { path = "../gz-sim-server" }
rapier3d-f64.workspace = true
plotters = { version = "=0.3.7", default-features = false, features = ["svg_backend", "line_series"] }
gz-sim-scene = { path = "../gz-sim-scene", features = ["distributed-physics"] }
sdformat.workspace = true
clap.workspace = true
gz-sim-cli = { path = "../gz-sim-cli" }

[lints]
workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
rustix = { version = "=1.1.5", features = ["process"] }

[[example]]
name = "ground_sweep_probe"
required-features = ["smooth-plane-diagnostics"]

[[test]]
name = "smooth_plane_bounds"
required-features = ["smooth-plane-diagnostics"]
