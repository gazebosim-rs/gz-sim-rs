name: simulator
on: [push, pull_request]
jobs:
  verify-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt,llvm-tools-preview
      - run: python3 scripts/verify.py
        env:
          GZ_COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
