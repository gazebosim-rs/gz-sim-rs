name: simulator
on: [push, pull_request]
jobs:
  verify-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt,llvm-tools-preview
      - name: Install native client build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev cmake curl gnupg pkg-config mesa-vulkan-drivers libvulkan1
      - name: Authenticate the archived Ubuntu snapshot and install the locked client packages
        shell: bash
        run: |
          python3 scripts/stage-zenoh-package-metadata.py
          python3 scripts/bootstrap-zenoh-native.py --verify-packages-only
          metadata="$PWD/artifacts/zenoh-native-package-metadata"
          apt="$PWD/artifacts/zenoh-ci-apt"
          mkdir "$apt"
          mkdir -p "$apt"/{lists/partial,archives/partial,preferences.d,sources.list.d}
          for suite in noble noble-updates noble-security; do
            dist="$apt/repo/dists/$suite"
            mkdir -p "$dist"/{main,universe}/binary-amd64
            cp "$metadata/$suite.InRelease" "$dist/InRelease"
            for component in main universe; do
              cp "$metadata/$suite-$component.Packages.xz" "$dist/$component/binary-amd64/Packages.xz"
            done
          done
          # APT reads indexes exclusively from the signed archive. Only .deb payloads may use HTTPS mirrors.
          snapshot=$(python3 -c 'import json; print(json.load(open("planning/zenoh-native-lock.json"))["platform"]["ubuntu_snapshot"])')
          printf 'file:%s/repo/\ttype:index\n' "$apt" > "$apt/mirrors"
          printf 'https://archive.ubuntu.com/ubuntu/\tpriority:1 type:deb\n' >> "$apt/mirrors"
          printf 'https://snapshot.ubuntu.com/ubuntu/%s/\tpriority:2 type:deb\n' "$snapshot" >> "$apt/mirrors"
          cat > "$apt/sources.list.d/ubuntu.sources" <<EOF
          Types: deb
          URIs: mirror+file:$apt/mirrors
          Suites: noble noble-updates noble-security
          Components: main universe
          Architectures: amd64
          Targets: Packages
          By-Hash: no
          Signed-By: /usr/share/keyrings/ubuntu-archive-keyring.gpg
          Check-Valid-Until: no
          EOF
          printf 'Package: *\nPin: release o=Ubuntu\nPin-Priority: 1001\n' > "$apt/snapshot.pref"
          options=(-o Acquire::Retries=3 -o Acquire::Languages=none -o Acquire::CompressionTypes::Order=xz
                   -o Dir::Etc::sourcelist=/dev/null -o "Dir::Etc::sourceparts=$apt/sources.list.d"
                   -o "Dir::Etc::preferences=$apt/snapshot.pref" -o "Dir::Etc::preferencesparts=$apt/preferences.d"
                   -o "Dir::State::lists=$apt/lists" -o "Dir::Cache::archives=$apt/archives")
          sudo apt-get "${options[@]}" --error-on=any update
          pins=$(python3 -c 'import json; print(*(f"{k}={v}" for k,v in json.load(open("planning/zenoh-native-lock.json"))["packages"].items()), sep="\n")')
          mapfile -t packages <<< "$pins"
          sudo apt-get "${options[@]}" -y --allow-downgrades install "${packages[@]}"
      - name: Check that APT rejects a damaged transitive package
        run: |
          rustc --edition=2024 --test tests/zenoh_signed_apt.rs -o artifacts/check-signed-apt
          artifacts/check-signed-apt
      - name: Build and validate the selected Zenoh client reference
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          lock = json.loads(Path('planning/zenoh-native-lock.json').read_text())
          vendor = lock['vendor']
          filename = vendor['url'].rsplit('/', 1)[1]
          archive = Path('artifacts/zenoh-ci-downloads') / filename
          archive.parent.mkdir(parents=True, exist_ok=True)
          # Preserve the exact locked vendor bytes independently of rolling ROS retention.
          archive_url = 'https://github.com/gazebosim-rs/gz-sim-rs/releases/download/native-build-inputs-v1/' + filename
          subprocess.run(['curl', '--fail', '--location', archive_url, '--output', str(archive)], check=True)
          if hashlib.sha256(archive.read_bytes()).hexdigest() != vendor['sha256']:
              raise ValueError('Zenoh vendor archive differs from the locked bytes')
          subprocess.run(['python3', 'scripts/bootstrap-zenoh-native.py', '--jobs', '2', '--vendor-archive', str(archive.resolve())], check=True)
          subprocess.run(['python3', 'scripts/bootstrap-zenoh-native.py', '--validate-only'], check=True)
          PYCODE
      - name: Enable isolated process-limit controls on the hosted runner
        id: userns
        shell: bash
        run: |
          policy=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)
          case "$policy" in 0|1) ;; *) exit 1 ;; esac
          echo "policy=$policy" >> "$GITHUB_OUTPUT"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare -Ur true
      - name: Select the software Vulkan adapter
        shell: bash
        run: |
          shopt -s nullglob
          icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          test "${#icds[@]}" -eq 1
          echo "VK_ICD_FILENAMES=${icds[0]}" >> "$GITHUB_ENV"
          echo "GZ_RENDER_REQUIRE_LLVMPIPE=1" >> "$GITHUB_ENV"
      - name: Run python3 scripts/verify.py
        shell: bash
        run: |
          # Match the qualified local debug-info profile without changing coverage.
          snapshot() {
            echo "CI resource snapshot: $1 $(date -u +%FT%TZ)"
            df -Pk . /tmp /dev/shm
            df -Pi . /tmp /dev/shm
            awk '/^(MemAvailable|SwapTotal|SwapFree):/' /proc/meminfo
            for name in memory.current memory.max memory.peak; do
              path="/sys/fs/cgroup/$name"
              if [ -r "$path" ]; then printf '%s=' "$name"; cat "$path"; fi
            done
            printf 'Cargo dev/test debug=%s/%s\n' "$CARGO_PROFILE_DEV_DEBUG" "$CARGO_PROFILE_TEST_DEBUG"
            if [ -d target ]; then timeout 10s du -sk target; fi
          }
          mkdir -p artifacts/coverage
          snapshot before 2>&1 | head -c 65536 | tee artifacts/coverage/ci-resources.log || echo "Initial resource diagnostics incomplete"
          status=0
          python3 scripts/verify.py || status=$?
          snapshot after 2>&1 | head -c 65536 | tee -a artifacts/coverage/ci-resources.log || echo "Final resource diagnostics incomplete"
          exit "$status"
        env:
          # CI builds each candidate once. Omit incremental caches to leave space for both instrumented profiles.
          CARGO_INCREMENTAL: '0'
          CARGO_PROFILE_DEV_DEBUG: '0'
          CARGO_PROFILE_TEST_DEBUG: '0'
          GZ_COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GZ_ZENOH_REFERENCE_ROOT: ${{ github.workspace }}/artifacts/zenoh-native-reference
      - name: Restore the hosted runner user-namespace policy
        if: always()
        env:
          ORIGINAL_USERNS_POLICY: ${{ steps.userns.outputs.policy }}
        shell: bash
        run: |
          if [ -n "$ORIGINAL_USERNS_POLICY" ]; then
            sudo sysctl -w "kernel.apparmor_restrict_unprivileged_userns=$ORIGINAL_USERNS_POLICY"
          fi
      - name: Retain separate coverage profiles
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: render-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/coverage/
          if-no-files-found: error
