name: simulator
on: [push, pull_request]
jobs:
  verify-core:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - run: rustup toolchain install 1.97.1 --profile minimal --component clippy,rustfmt,llvm-tools-preview
      - name: Install native client build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev cmake curl gnupg pkg-config mesa-vulkan-drivers libvulkan1
          # DART 6.13.2 from the same OSRF build that upstream gz-physics links.
          sudo curl -fsSL https://packages.osrfoundation.org/gazebo.gpg -o /usr/share/keyrings/pkgs-osrf-archive-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/pkgs-osrf-archive-keyring.gpg] https://packages.osrfoundation.org/gazebo/ubuntu-stable noble main" | sudo tee /etc/apt/sources.list.d/gazebo-stable.list
          sudo apt-get update
          sudo apt-get install -y libdart6.13-dev libdart6.13-collision-ode-dev
      - name: Install the locked native client packages from the signed snapshot
        shell: bash
        run: |
          python3 - <<'PYCODE'
          import json
          from pathlib import Path
          import subprocess
          lock = json.loads(Path('planning/zenoh-native-lock.json').read_text())
          apt = Path('artifacts/zenoh-ci-apt').resolve()
          subprocess.run(['sh', 'reference/apt-sources.sh', str(apt), lock['platform']['ubuntu_snapshot']], check=True)
          for name in ['lists/partial', 'archives/partial', 'preferences.d']:
              (apt / name).mkdir(parents=True, exist_ok=True)
          preferences = apt / 'snapshot.pref'
          preferences.write_text('Package: *\nPin: origin snapshot.ubuntu.com\nPin-Priority: 1001\n')
          options = ['-o', 'Dir::Etc::sourcelist=/dev/null',
                     '-o', f'Dir::Etc::preferences={preferences}',
                     '-o', f'Dir::Etc::preferencesparts={apt}/preferences.d',
                     '-o', f'Dir::Etc::sourceparts={apt}/sources.list.d',
                     '-o', f'Dir::State::lists={apt}/lists',
                     '-o', f'Dir::Cache::archives={apt}/archives']
          subprocess.run(['sudo', 'apt-get', *options, 'update'], check=True)
          packages = [f'{name}={version}' for name, version in lock['packages'].items()]
          subprocess.run(['sudo', 'apt-get', *options, 'install', '-y', '--allow-downgrades', *packages], check=True)
          PYCODE
      - name: Build and validate the selected Zenoh client reference
        shell: bash
        run: |
          python3 scripts/bootstrap-zenoh-native.py --verify-packages-only
          python3 - <<'PYCODE'
          import hashlib
          import json
          from pathlib import Path
          import subprocess
          lock = json.loads(Path('planning/zenoh-native-lock.json').read_text())
          vendor = lock['vendor']
          filename = vendor['url'].rsplit('/', 1)[1]
          archive = Path('artifacts/zenoh-ci-downloads') / filename
          archive.parent.mkdir(parents=True, exist_ok=True)
          # The canonical ROS URL currently has a TLS hostname mismatch.
          mirror = 'https://repo.ros2.org/ubuntu/main/pool/main/r/ros-jazzy-zenoh-cpp-vendor/' + filename
          subprocess.run(['curl', '--fail', '--location', mirror, '--output', str(archive)], check=True)
          if hashlib.sha256(archive.read_bytes()).hexdigest() != vendor['sha256']:
              raise ValueError('Zenoh vendor archive differs from the locked bytes')
          subprocess.run(['python3', 'scripts/bootstrap-zenoh-native.py', '--jobs', '2', '--vendor-archive', str(archive.resolve())], check=True)
          subprocess.run(['python3', 'scripts/bootstrap-zenoh-native.py', '--validate-only'], check=True)
          PYCODE
      - uses: actions/cache@5a3ec84eff668545956fd18022155c47e93e2684
        with:
          path: artifacts/physics-reference/mujoco
          key: mujoco-${{ hashFiles('scripts/bootstrap-physics.py') }}
      - run: python3 scripts/bootstrap-physics.py --jobs 2
      - name: Enable isolated process-limit controls on the hosted runner
        id: userns
        shell: bash
        run: |
          policy=$(sysctl -n kernel.apparmor_restrict_unprivileged_userns)
          case "$policy" in 0|1) ;; *) exit 1 ;; esac
          echo "policy=$policy" >> "$GITHUB_OUTPUT"
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          unshare -Ur true
      - name: Select the software Vulkan adapter
        shell: bash
        run: |
          shopt -s nullglob
          icds=(/usr/share/vulkan/icd.d/lvp_icd*.json)
          test "${#icds[@]}" -eq 1
          echo "VK_ICD_FILENAMES=${icds[0]}" >> "$GITHUB_ENV"
          echo "GZ_RENDER_REQUIRE_LLVMPIPE=1" >> "$GITHUB_ENV"
      - run: python3 scripts/verify.py
        env:
          GZ_COVERAGE_BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          GZ_ZENOH_REFERENCE_ROOT: ${{ github.workspace }}/artifacts/zenoh-native-reference
          MUJOCO_PREFIX: ${{ github.workspace }}/artifacts/physics-reference/mujoco
      - name: Restore the hosted runner user-namespace policy
        if: always()
        env:
          ORIGINAL_USERNS_POLICY: ${{ steps.userns.outputs.policy }}
        shell: bash
        run: |
          if [ -n "$ORIGINAL_USERNS_POLICY" ]; then
            sudo sysctl -w "kernel.apparmor_restrict_unprivileged_userns=$ORIGINAL_USERNS_POLICY"
          fi
      - name: Retain separate coverage profiles
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: render-coverage-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/coverage/
          if-no-files-found: error
