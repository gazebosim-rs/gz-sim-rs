[workspace]
members = ["crates/gz-assets", "crates/gz-physics-tpe", "crates/gz-physics", "crates/gz-sim-core", "crates/gz-physics-rapier", "crates/gz-sensors", "crates/gz-sim-scene", "crates/gz-sim-cli", "crates/gz-sim-server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

[workspace.dependencies]
gz-fuel-tools = { git = "https://github.com/gazebosim-rs/gz-fuel-tools-rs", rev = "3747086ed13b59d2f7701eedc11329ebd7c9df3a" }
bevy_ecs = { version = "=0.20.0", default-features = false, features = ["std", "multi_threaded"] }
thiserror = "=2.0.18"
glam = "=0.33.12"
clap = { version = "=4.6.7", features = ["derive"] }
sdformat = { git = "https://github.com/gazebosim-rs/sdformat-rs", rev = "4ed690b3a872e395df0f3544b278c7f1d3c45a7e" }
gz-msgs = { git = "https://github.com/gazebosim-rs/gz-msgs-rs", rev = "2cea810e929adb4f925750b325265a99f9ae78b4" }
gz-transport = { git = "https://github.com/gazebosim-rs/gz-transport-rs", rev = "48a58eed4e2a3a7613f8b0cd6b0842d7b758a848" }
rapier3d-f64 = { version = "=0.36.1", features = ["enhanced-determinism"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
