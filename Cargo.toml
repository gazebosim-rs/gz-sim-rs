[workspace]
members = ["crates/gz-assets", "crates/gz-physics-tpe", "crates/gz-physics", "crates/gz-sim-core", "crates/gz-physics-rapier", "crates/gz-sensors", "crates/gz-sim-scene", "crates/gz-sim-cli", "crates/gz-sim-server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

[workspace.dependencies]
bevy_ecs = { version = "=0.20.0", default-features = false, features = ["std", "multi_threaded"] }
thiserror = "=2.0.18"
glam = "=0.33.12"
clap = { version = "=4.6.7", features = ["derive"] }
sdformat = { git = "https://github.com/gazebosim-rs/sdformat-rs", rev = "80b6c74a5fc69574fdac592eeb10b1111f789871" }
gz-msgs = { git = "https://github.com/gazebosim-rs/gz-msgs-rs", rev = "195644d8daeb1fa17ed8830e885a36f25ba71871" }
gz-transport = { git = "https://github.com/gazebosim-rs/gz-transport-rs", rev = "c00de5e4a33a884336dba4952547d3167ec74709" }
rapier3d-f64 = { version = "=0.36.1", features = ["enhanced-determinism"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
