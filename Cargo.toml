[workspace]
members = ["crates/gz-sim-core", "crates/gz-physics-rapier", "crates/gz-sensors", "crates/gz-sim-scene", "crates/gz-sim-cli"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "Apache-2.0"

[workspace.dependencies]
bevy_ecs = { version = "=0.20.0", default-features = false, features = ["std", "multi_threaded"] }
thiserror = "=2.0.18"
glam = "=0.33.12"
clap = { version = "=4.6.7", features = ["derive"] }
sdformat = { git = "https://github.com/gazebosim-rs/sdformat-rs", rev = "8109265aa8e70b23fcd6cb137c0531de8bb4e336" }
rapier3d-f64 = { version = "=0.36.1", features = ["enhanced-determinism"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
