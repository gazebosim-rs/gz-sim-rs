[workspace]
members = ["crates/gz-sim-proto", "crates/gz-assets", "crates/gz-physics-tpe", "crates/gz-physics", "crates/gz-sim-core", "crates/gz-physics-rapier", "crates/gz-physics-dart", "crates/gz-physics-mujoco", "crates/gz-sensors", "crates/gz-sim-scene", "crates/gz-sim-cli", "crates/gz-sim-server", "crates/gz-camera-output", "crates/gz-render-scene", "crates/gz-render-frame", "crates/gz-renderer", "crates/gz-render-protocol", "crates/gz-render-client", "crates/gz-render-worker", "tests/support/render-fixtures"]
default-members = ["crates/gz-assets", "crates/gz-physics-tpe", "crates/gz-physics", "crates/gz-sim-core", "crates/gz-physics-rapier", "crates/gz-physics-dart", "crates/gz-physics-mujoco", "crates/gz-sensors", "crates/gz-sim-scene", "crates/gz-sim-cli", "crates/gz-sim-server"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"

[patch.crates-io]
prost-derive = { path = "third_party/prost-derive-0.14.4" }

[workspace.dependencies]
uuid = { version = "=1.23.1", features = ["v4"] }
zenoh = { version = "=1.8.0", default-features = false, features = ["transport_tcp"] }
gz-sim-proto = { path = "crates/gz-sim-proto" }
petgraph = "=0.8.3"
gz-fuel-tools = { git = "https://github.com/gazebosim-rs/gz-fuel-tools-rs", rev = "3747086ed13b59d2f7701eedc11329ebd7c9df3a" }
bevy_ecs = { version = "=0.20.0", default-features = false, features = ["std", "multi_threaded"] }
thiserror = "=2.0.18"
glam = "=0.33.12"
clap = { version = "=4.6.7", features = ["derive"] }
sdformat = { git = "https://github.com/gazebosim-rs/sdformat-rs", rev = "a44bf8be09aff979449afddc8c75118c4ae1a227" }
rapier3d-f64 = { version = "=0.36.1", features = ["enhanced-determinism"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"
